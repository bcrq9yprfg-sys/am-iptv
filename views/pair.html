<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AM IPTV — TV koppelen</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #06060f;
      --card: #0e0e1f;
      --purple: #7c5cfc;
      --gold: #f5b942;
      --text: #e8e8f0;
      --muted: #7a7a9a;
      --border: rgba(124,92,252,.2);
      --radius: 16px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 32px 16px 48px;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 28px;
    }
    .logo .am   { color: var(--gold); }
    .logo .dot  { color: var(--purple); margin: 0 2px; }
    .logo .iptv { color: var(--text); }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 24px;
      width: 100%;
      max-width: 420px;
    }

    .card h1 {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .card .sub {
      color: var(--muted);
      font-size: .9rem;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .code-badge {
      display: inline-block;
      background: rgba(124,92,252,.15);
      border: 1px solid var(--border);
      color: var(--purple);
      font-family: monospace;
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: .15em;
      padding: 6px 16px;
      border-radius: 8px;
      margin-bottom: 24px;
    }

    /* Tab switcher */
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all .2s;
    }
    .tab-btn.active {
      background: rgba(124,92,252,.2);
      border-color: var(--purple);
      color: var(--text);
    }

    /* Form */
    .form-group { margin-bottom: 14px; }
    label {
      display: block;
      font-size: .82rem;
      color: var(--muted);
      margin-bottom: 5px;
      font-weight: 500;
    }
    input[type=text], input[type=url], input[type=password] {
      width: 100%;
      background: rgba(255,255,255,.05);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: .95rem;
      padding: 11px 14px;
      outline: none;
      transition: border-color .2s;
      -webkit-appearance: none;
    }
    input:focus { border-color: var(--purple); }
    input::placeholder { color: var(--muted); }

    .btn {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: none;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .2s, transform .1s;
      margin-top: 6px;
    }
    .btn:active { transform: scale(.98); }
    .btn-primary {
      background: linear-gradient(135deg, var(--purple), #5a3dd6);
      color: #fff;
    }
    .btn:disabled { opacity: .5; cursor: not-allowed; }

    /* States */
    .state { display: none; text-align: center; padding: 20px 0; }
    .state.active { display: block; }
    .state-icon { font-size: 3rem; margin-bottom: 12px; }
    .state h2 { font-size: 1.2rem; margin-bottom: 8px; }
    .state p  { color: var(--muted); font-size: .9rem; line-height: 1.5; }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="logo"><span class="am">AM</span><span class="dot">·</span><span class="iptv">IPTV</span></div>

  <div class="card">

    <!-- FORM STATE -->
    <div id="stateForm" class="state active">
      <h1>📺 TV koppelen</h1>
      <p class="sub"><span>Code op je TV:</span> <span class="code-badge">{{ code }}</span><br>
        <span>Vul je streaminggegevens in — ze worden direct naar je TV gestuurd.</span></p>

      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('m3u', this)">M3U Playlist</button>
        <button class="tab-btn"        onclick="switchTab('xtream', this)">Xtream Codes</button>
      </div>

      <form id="pairForm" onsubmit="submitForm(event)">
        <input type="hidden" id="typeField" value="m3u">

        <!-- M3U tab -->
        <div id="tabM3u">
          <div class="form-group">
            <label for="m3uUrl">M3U URL</label>
            <input type="url" id="m3uUrl" name="m3u_url" placeholder="http://..." autocomplete="off">
          </div>
        </div>

        <!-- Xtream tab -->
        <div id="tabXtream" class="hidden">
          <div class="form-group">
            <label for="xHost">Server URL</label>
            <input type="text" id="xHost" name="xtream_host" placeholder="http://server.com:8080" autocomplete="off">
          </div>
          <div class="form-group">
            <label for="xUser">Gebruikersnaam</label>
            <input type="text" id="xUser" name="xtream_user" placeholder="gebruikersnaam" autocomplete="off">
          </div>
          <div class="form-group">
            <label for="xPass">Wachtwoord</label>
            <input type="password" id="xPass" name="xtream_pass" placeholder="••••••••" autocomplete="off">
          </div>
        </div>

        <button type="submit" class="btn btn-primary" id="submitBtn">Naar TV sturen →</button>
      </form>
    </div>

    <!-- SUCCESS STATE -->
    <div id="stateOk" class="state">
      <div class="state-icon">✅</div>
      <h2>Gelukt!</h2>
      <p><span>Je gegevens zijn naar je TV gestuurd.</span><br><span>Je kunt dit venster sluiten.</span></p>
    </div>

    <!-- ERROR STATE -->
    <div id="stateErr" class="state">
      <div class="state-icon">⚠️</div>
      <h2 id="errTitle">Mislukt</h2>
      <p id="errMsg">Probeer opnieuw.</p>
    </div>

  </div>

  <script>
    /* Taal volgt de telefoon: Nederlands of Engels */
    const NL = (navigator.language || '').toLowerCase().startsWith('nl');
    const EN = {
      '📺 TV koppelen': '📺 Connect your TV', 'Code op je TV:': 'Code on your TV:',
      'Vul je streaminggegevens in — ze worden direct naar je TV gestuurd.': 'Enter your playlist details — they are sent straight to your TV.',
      'Gebruikersnaam': 'Username', 'Wachtwoord': 'Password', 'gebruikersnaam': 'username',
      'Naar TV sturen →': 'Send to TV →', 'Versturen…': 'Sending…', 'Gelukt!': 'Done!',
      'Je gegevens zijn naar je TV gestuurd.': 'Your details have been sent to your TV.',
      'Je kunt dit venster sluiten.': 'You can close this page.', 'Mislukt': 'Failed',
      'Probeer opnieuw.': 'Please try again.', 'Niet gelukt': 'Not sent', 'Fout': 'Error'
    };
    const t = s => NL ? s : (EN[s] || s);
    if (!NL) {
      document.documentElement.lang = 'en';
      const w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
      const nodes = []; let n; while ((n = w.nextNode())) nodes.push(n);
      nodes.forEach(n => { const v = n.nodeValue.trim(); if (v && EN[v]) n.nodeValue = n.nodeValue.replace(v, EN[v]); });
      document.querySelectorAll('[placeholder]').forEach(el => { const v = el.placeholder; if (EN[v]) el.placeholder = EN[v]; });
    }
    const CODE = '{{ code }}';

    function switchTab(type, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('typeField').value = type;
      document.getElementById('tabM3u').classList.toggle('hidden', type !== 'm3u');
      document.getElementById('tabXtream').classList.toggle('hidden', type !== 'xtream');
    }

    function showState(id) {
      document.querySelectorAll('.state').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    async function submitForm(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = t('Versturen…');

      const type = document.getElementById('typeField').value;
      const body = { type };
      if (type === 'm3u') {
        body.m3u_url = document.getElementById('m3uUrl').value.trim();
        if (!body.m3u_url) { btn.disabled=false; btn.textContent=t('Naar TV sturen →'); return; }
      } else {
        body.xtream_host = document.getElementById('xHost').value.trim();
        body.xtream_user = document.getElementById('xUser').value.trim();
        body.xtream_pass = document.getElementById('xPass').value;
        if (!body.xtream_host || !body.xtream_user || !body.xtream_pass) {
          btn.disabled=false; btn.textContent=t('Naar TV sturen →'); return;
        }
      }

      try {
        const r = await fetch(`/api/pair/${CODE}/submit`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || 'Fout');
        showState('stateOk');
      } catch (err) {
        document.getElementById('errTitle').textContent = t('Niet gelukt');
        document.getElementById('errMsg').textContent = err.message;
        showState('stateErr');
        btn.disabled = false;
        btn.textContent = t('Naar TV sturen →');
      }
    }
  </script>
</body>
</html>
